<!DOCTYPE html>
<!--
  ============================================================================
  ECO 3101 — Interactive practice page.  Self-contained: one HTML file.
  No installation, no server. Double-click to open; drop into a GitHub repo
  to publish for students.

  HOW IT'S ORGANIZED (for editing later):
  - All the math/questions live in the QUESTIONS array near the bottom of the
    <script>. Each entry is one "problem type." To change the random ranges,
    edit the numbers inside its gen() function — look for "EDIT NUMBERS HERE".
  - To add a new problem type, copy one block and adjust it.
  - The look (colors/fonts) is in the <style> block; you can ignore it.
  ============================================================================
-->
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Lecture 6 Exercises — Intermediate Microeconomics</title>

<!-- Fonts: IBM Plex family (academic/technical feel) -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Serif:wght@500;600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<!-- MathJax: renders the LaTeX math. Loads from a CDN; needs internet.
     We boot the app from MathJax's pageReady hook (see config below). -->
<script>
  window.MathJax = {
    tex: { inlineMath: [['\\(', '\\)'], ['$', '$']], displayMath: [['$$', '$$']] },
    svg: { fontCache: 'global' },
    startup: {
      typeset: false,
      pageReady: () => MathJax.startup.defaultPageReady().then(() => boot())
    }
  };
</script>
<script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-svg.js" id="MathJax-script" async></script>

<style>
  :root{
    --paper:#eef1f5;        /* page background (cool soft white) */
    --grid:#e0e5ec;         /* faint graph-paper lines */
    --card:#ffffff;
    --ink:#17263a;          /* primary text: deep slate-navy */
    --muted:#5d6b7c;        /* secondary text */
    --line:#dde3ea;         /* hairlines / borders */
    --accent:#2b5c8a;       /* scholarly blue */
    --accent-d:#1f456a;
    --success:#2f7a52;
    --success-bg:#eaf4ee;
    --error:#b0432e;
    --error-bg:#f7ece9;
    --shadow:0 1px 2px rgba(23,38,58,.05), 0 12px 30px rgba(23,38,58,.07);
  }

  *{ box-sizing:border-box; }
  html,body{ margin:0; }
  body{
    font-family:'IBM Plex Sans', system-ui, sans-serif;
    color:var(--ink);
    background-color:var(--paper);
    background-image:
      linear-gradient(var(--grid) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid) 1px, transparent 1px);
    background-size:26px 26px;
    line-height:1.55;
    -webkit-font-smoothing:antialiased;
  }

  .wrap{ max-width:740px; margin:0 auto; padding:40px 20px 80px; }

  /* ---- Header ---- */
  .kicker{
    font:600 .72rem/1 'IBM Plex Mono', monospace;
    text-transform:uppercase; letter-spacing:.13em;
    color:var(--accent); margin:0 0 10px;
  }
  header{ display:flex; align-items:center; gap:14px; margin-bottom:6px; }
  .mark{ flex:0 0 auto; }
  .mark svg{ display:block; }
  h1{
    font-family:'IBM Plex Serif', Georgia, serif;
    font-weight:600; font-size:1.7rem; margin:0; letter-spacing:.01em;
  }
  .sub{ color:var(--muted); margin:.4em 0 26px; font-size:1rem; }

  /* ---- Topic selector ---- */
  .topics{ display:flex; flex-wrap:wrap; gap:8px; margin-bottom:20px; }
  .topic{
    font:500 .85rem/1 'IBM Plex Sans', sans-serif;
    color:var(--muted); background:var(--card);
    border:1px solid var(--line); border-radius:999px;
    padding:8px 15px; cursor:pointer; transition:all .15s ease;
  }
  .topic:hover{ border-color:var(--accent); color:var(--accent); }
  .topic.active{
    background:var(--accent); border-color:var(--accent);
    color:#fff; box-shadow:0 4px 12px rgba(43,92,138,.22);
  }

  /* ---- Card ---- */
  .card{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:26px 26px 22px; box-shadow:var(--shadow);
  }
  .eyebrow{
    font:600 .72rem/1 'IBM Plex Mono', monospace;
    text-transform:uppercase; letter-spacing:.1em; color:var(--accent);
    margin-bottom:12px; display:flex; align-items:center; gap:8px;
  }
  .prompt{ font-size:1.05rem; }
  .prompt p{ margin:.5em 0; }
  .prompt .hint{
    color:var(--muted); font-size:.92rem;
    border-left:3px solid var(--line); padding-left:12px; margin-top:14px;
  }

  /* ---- Answer fields ---- */
  .answers{ margin-top:20px; display:flex; flex-direction:column; gap:12px; }
  .field{ display:flex; align-items:center; gap:10px; flex-wrap:wrap; }
  .field label{ font-size:.95rem; color:var(--ink); min-width:0; }
  .field .inputwrap{ display:inline-flex; align-items:center; gap:6px; }
  .field .prefix{ color:var(--muted); font-family:'IBM Plex Mono', monospace; }
  .field input{
    width:130px; font:500 1rem 'IBM Plex Mono', monospace;
    color:var(--ink); background:var(--paper);
    border:1.5px solid var(--line); border-radius:9px; padding:9px 11px;
    transition:border-color .15s ease, background .15s ease;
  }
  .field input:focus{ outline:none; border-color:var(--accent); background:#fff; }
  .field .unit{ color:var(--muted); font-size:.9rem; }
  .field.ok input{ border-color:var(--success); background:var(--success-bg); }
  .field.no input{ border-color:var(--error); background:var(--error-bg); }
  .field .tag{
    font:600 .68rem/1 'IBM Plex Mono', monospace; text-transform:uppercase;
    letter-spacing:.06em; padding:3px 7px; border-radius:6px; opacity:0;
  }
  .field.ok .tag{ opacity:1; color:var(--success); background:var(--success-bg); }
  .field.no .tag{ opacity:1; color:var(--error); background:var(--error-bg); }

  /* ---- Multiple choice ---- */
  .choices{ margin-top:20px; display:flex; flex-direction:column; gap:10px; }
  .choice{
    text-align:left; font:500 1rem 'IBM Plex Sans', sans-serif; color:var(--ink);
    background:var(--paper); border:1.5px solid var(--line); border-radius:11px;
    padding:13px 16px; cursor:pointer; transition:all .13s ease;
    display:flex; align-items:center; gap:12px;
  }
  .choice:hover{ border-color:var(--accent); }
  .choice .bullet{
    flex:0 0 auto; width:22px; height:22px; border-radius:50%;
    border:1.5px solid var(--line); display:inline-flex; align-items:center;
    justify-content:center; font:600 .8rem 'IBM Plex Mono', monospace; color:var(--muted);
  }
  .choice.sel{ border-color:var(--accent); background:#fff; box-shadow:0 3px 10px rgba(43,92,138,.14); }
  .choice.sel .bullet{ border-color:var(--accent); color:var(--accent); }
  .choice.ok{ border-color:var(--success); background:var(--success-bg); }
  .choice.ok .bullet{ border-color:var(--success); color:var(--success); background:#fff; }
  .choice.no{ border-color:var(--error); background:var(--error-bg); }
  .choice.no .bullet{ border-color:var(--error); color:var(--error); background:#fff; }

  /* ---- Multi-select (checkbox) ---- */
  .choice .box{
    flex:0 0 auto; width:21px; height:21px; border-radius:6px;
    border:1.5px solid var(--line); display:inline-flex; align-items:center;
    justify-content:center; background:#fff;
  }
  .choice .box svg{ width:13px; height:13px; opacity:0; }
  .choice.sel .box{ border-color:var(--accent); background:var(--accent); }
  .choice.sel .box svg{ opacity:1; }
  .choice.ok .box{ border-color:var(--success); background:var(--success); }
  .choice.ok .box svg{ opacity:1; }
  .choice.no .box{ border-color:var(--error); background:var(--error); }
  .choice.no .box svg{ opacity:1; }

  /* ---- Matching ---- */
  .matchrows{ margin-top:20px; display:flex; flex-direction:column; gap:12px; }
  .matchrow{ display:flex; align-items:center; gap:12px; flex-wrap:wrap; }
  .matchrow .ml{ flex:1 1 250px; font-size:.98rem; }
  .matchrow select{
    font:500 .95rem 'IBM Plex Sans',sans-serif; color:var(--ink); background:var(--paper);
    border:1.5px solid var(--line); border-radius:9px; padding:9px 11px; min-width:190px; cursor:pointer;
  }
  .matchrow select:focus{ outline:none; border-color:var(--accent); background:#fff; }
  .matchrow.ok select{ border-color:var(--success); background:var(--success-bg); }
  .matchrow.no select{ border-color:var(--error); background:var(--error-bg); }
  .matchrow .tag{ font:600 .68rem/1 'IBM Plex Mono',monospace; text-transform:uppercase;
    letter-spacing:.06em; padding:3px 7px; border-radius:6px; opacity:0; }
  .matchrow.ok .tag{ opacity:1; color:var(--success); background:var(--success-bg); }
  .matchrow.no .tag{ opacity:1; color:var(--error); background:var(--error-bg); }

  /* ---- Diagram ---- */
  .diagram{ margin:18px 0 6px; text-align:center; }
  .diagram svg{ max-width:100%; height:auto; background:#fff;
    border:1px solid var(--line); border-radius:10px; }
  .diagram .cap{ color:var(--muted); font-size:.85rem; margin-top:6px; }

  /* ---- Actions ---- */
  .actions{ display:flex; align-items:center; gap:10px; margin-top:22px; flex-wrap:wrap; }
  .btn{
    font:600 .92rem 'IBM Plex Sans', sans-serif; cursor:pointer;
    border-radius:10px; padding:11px 18px; border:1.5px solid transparent;
    transition:all .15s ease;
  }
  .btn-primary{ background:var(--accent); color:#fff; border-color:var(--accent); }
  .btn-primary:hover{ background:var(--accent-d); border-color:var(--accent-d); }
  .btn-ghost{ background:#fff; color:var(--accent); border-color:var(--line); }
  .btn-ghost:hover{ border-color:var(--accent); }
  .btn-text{
    background:none; border:none; cursor:pointer; color:var(--muted);
    font:500 .9rem 'IBM Plex Sans', sans-serif; text-decoration:underline;
    text-underline-offset:3px; padding:6px 4px;
  }
  .btn-text:hover{ color:var(--accent); }
  .spacer{ flex:1 1 auto; }
  .score{ font:500 .85rem 'IBM Plex Mono', monospace; color:var(--muted); }

  /* ---- Feedback + solution ---- */
  .feedback{ margin-top:16px; font-weight:500; font-size:.96rem; display:none; }
  .feedback.show{ display:block; }
  .feedback.good{ color:var(--success); }
  .feedback.bad{ color:var(--error); }
  .solution{
    display:none; margin-top:14px; padding:16px 18px;
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    font-size:.95rem;
  }
  .solution.show{ display:block; }
  .solution h4{
    margin:0 0 8px; font:600 .72rem/1 'IBM Plex Mono', monospace;
    text-transform:uppercase; letter-spacing:.08em; color:var(--muted);
  }
  .solution p{ margin:.4em 0; }

  footer{ margin-top:30px; color:var(--muted); font-size:.82rem; text-align:center; }

  @media (max-width:520px){
    .wrap{ padding:26px 14px 60px; }
    .actions{ gap:8px; }
    .spacer{ flex-basis:100%; height:0; }
  }
  @media (prefers-reduced-motion:no-preference){
    .card{ animation:rise .25s ease both; }
    @keyframes rise{ from{ opacity:0; transform:translateY(6px);} to{ opacity:1; transform:none;} }
  }
</style>
</head>
<body>
<div class="wrap">

  <p class="kicker">ECO 3101 · Consumer Optimization</p>
  <header>
    <span class="mark" aria-hidden="true">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <path d="M5 29V5M5 29h24" stroke="#2b5c8a" stroke-width="2" stroke-linecap="round"/>
        <path d="M6 24C12 24 13 9 28 8" stroke="#17263a" stroke-width="2" stroke-linecap="round" fill="none"/>
      </svg>
    </span>
    <h1>Lecture 6 Exercises</h1>
  </header>
  <p class="sub">Intermediate Microeconomic Theory. Fresh numbers every time — work it out, type your answer, check yourself.</p>

  <div class="topics" id="topics" role="group" aria-label="Choose a problem type"></div>

  <div class="card" id="card">
    <div class="eyebrow"><span id="eyebrow">—</span></div>
    <div class="prompt" id="prompt"></div>

    <div class="answers" id="answers"></div>

    <div class="actions">
      <button class="btn btn-primary" id="check">Check answer</button>
      <button class="btn btn-ghost" id="next">New question</button>
      <button class="btn-text" id="steps">Show steps</button>
      <span class="spacer"></span>
      <span class="score" id="score">Solved 0</span>
    </div>

    <div class="feedback" id="feedback" aria-live="polite"></div>
    <div class="solution" id="solution"></div>
  </div>

  <footer>Ungraded self-practice. Reload for a fresh set. Built for ECO 3101.</footer>
</div>

<script>
/* ============================ small helpers ============================ */
const $ = (id) => document.getElementById(id);
const pick = (a) => a[Math.floor(Math.random() * a.length)];
const randint = (lo, hi) => lo + Math.floor(Math.random() * (hi - lo + 1));
function shuffle(a){ a = a.slice(); for (let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); [a[i],a[j]]=[a[j],a[i]]; } return a; }
const round = (x, d=6) => { const f = 10**d; return Math.round((x + Number.EPSILON) * f) / f; };
const comma = (x) => x.toLocaleString('en-US');
function parseNum(s){
  if (s == null) return null;
  s = String(s).trim().replace(/,/g,'').replace(/\s+/g,'');
  if (s === '') return null;
  // allow simple fractions like -3/4
  const frac = s.match(/^(-?\d*\.?\d+)\/(-?\d*\.?\d+)$/);
  if (frac){ const d = parseFloat(frac[2]); if (d === 0) return null; return parseFloat(frac[1]) / d; }
  const v = Number(s);
  return Number.isFinite(v) ? v : null;
}
function normTxt(s){
  return String(s == null ? '' : s).toLowerCase()
    .replace(/\s+/g,'').replace(/[*·×]/g,'').replace(/\\cdot/g,'')
    .replace(/\^/g,'').replace(/\{|\}/g,'');
}
function typeset(){ if (window.MathJax && MathJax.typesetPromise) MathJax.typesetPromise(); }

/* ============================ state / engine ============================ */
let current = 0;      // index into QUESTIONS
let problem = null;   // the generated instance
let solvedCount = 0;
let mcPick = null;    // selected choice index for MC questions
let multiPick = new Set(); // selected indices for multi-select questions

function buildTopics(){
  const box = $('topics');
  box.innerHTML = '';
  QUESTIONS.forEach((q, i) => {
    const b = document.createElement('button');
    b.className = 'topic' + (i === current ? ' active' : '');
    b.textContent = q.name;
    b.addEventListener('click', () => { current = i; syncTopics(); newProblem(); });
    box.appendChild(b);
  });
}
function syncTopics(){
  [...$('topics').children].forEach((b, i) => b.classList.toggle('active', i === current));
}

function newProblem(){
  problem = QUESTIONS[current].gen();
  mcPick = null;
  multiPick = new Set();
  $('eyebrow').textContent = QUESTIONS[current].eyebrow || QUESTIONS[current].name;
  $('prompt').innerHTML = problem.promptHTML;

  const wrap = $('answers');
  wrap.innerHTML = '';

  if (problem.mc){
    // multiple-choice rendering
    const list = document.createElement('div');
    list.className = 'choices';
    problem.mc.options.forEach((opt, i) => {
      const c = document.createElement('button');
      c.className = 'choice';
      c.dataset.idx = i;
      c.innerHTML = `<span class="bullet">${String.fromCharCode(65+i)}</span><span>${opt}</span>`;
      c.addEventListener('click', () => {
        mcPick = i;
        [...list.children].forEach(ch => ch.classList.remove('sel','ok','no'));
        c.classList.add('sel');
      });
      list.appendChild(c);
    });
    wrap.appendChild(list);
  } else if (problem.multi){
    // multiple-answers (checkbox) rendering
    const list = document.createElement('div');
    list.className = 'choices';
    problem.multi.options.forEach((opt, i) => {
      const c = document.createElement('button');
      c.className = 'choice';
      c.dataset.idx = i;
      c.innerHTML = `<span class="box"><svg viewBox="0 0 16 16" fill="none"><path d="M3 8.5l3.2 3.2L13 4.5" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg></span><span>${opt}</span>`;
      c.addEventListener('click', () => {
        if (multiPick.has(i)) multiPick.delete(i); else multiPick.add(i);
        c.classList.toggle('sel', multiPick.has(i));
        c.classList.remove('ok','no');
      });
      list.appendChild(c);
    });
    wrap.appendChild(list);
  } else if (problem.match){
    // matching rendering (each row: statement + a <select> of labels)
    const box = document.createElement('div');
    box.className = 'matchrows';
    const optionsHTML = ['<option value="">\u2014 choose \u2014</option>']
      .concat(problem.match.options.map((o,j) => `<option value="${j}">${o}</option>`)).join('');
    problem.match.rows.forEach((row, i) => {
      const r = document.createElement('div');
      r.className = 'matchrow';
      r.dataset.idx = i;
      r.innerHTML = `<span class="ml">${row.left}</span><select data-idx="${i}">${optionsHTML}</select><span class="tag"></span>`;
      box.appendChild(r);
    });
    wrap.appendChild(box);
  } else {
    // input-field rendering (numeric or text parts)
    problem.parts.forEach((part, idx) => {
      const field = document.createElement('div');
      field.className = 'field';
      field.innerHTML = `
        <label>${part.label}</label>
        <span class="inputwrap">
          ${part.prefix ? `<span class="prefix">${part.prefix}</span>` : ''}
          <input type="text" inputmode="${part.type === 'text' ? 'text' : 'decimal'}"
                 autocomplete="off" data-idx="${idx}" placeholder="${part.placeholder || '?'}">
          ${part.unit ? `<span class="unit">${part.unit}</span>` : ''}
        </span>
        <span class="tag"></span>`;
      wrap.appendChild(field);
    });
  }

  $('feedback').className = 'feedback';
  $('feedback').textContent = '';
  $('solution').className = 'solution';
  $('solution').innerHTML = problem.solutionHTML;

  typeset();
  const first = wrap.querySelector('input');
  if (first) first.focus();
}

function checkAnswers(){
  const fb = $('feedback');

  if (problem.mc){
    const list = $('answers').querySelector('.choices');
    if (mcPick == null){
      fb.className = 'feedback show bad';
      fb.textContent = 'Select an option first.';
      return;
    }
    const correct = problem.mc.correct;
    [...list.children].forEach((ch, i) => {
      ch.classList.remove('sel','ok','no');
      if (i === correct) ch.classList.add('ok');
      else if (i === mcPick) ch.classList.add('no');
    });
    fb.className = 'feedback show';
    if (mcPick === correct){
      fb.classList.add('good'); fb.textContent = '\u2713 Correct.';
      solvedCount++; $('score').textContent = 'Solved ' + solvedCount;
    } else {
      fb.classList.add('bad');
      fb.textContent = 'Not quite — the highlighted option is correct. See the steps below.';
    }
    return;
  }

  if (problem.multi){
    const list = $('answers').querySelector('.choices');
    if (multiPick.size === 0){
      fb.className = 'feedback show bad';
      fb.textContent = 'Select at least one option (or as many as apply).';
      return;
    }
    const correct = new Set(problem.multi.correct);
    const ok = correct.size === multiPick.size && [...correct].every(i => multiPick.has(i));
    [...list.children].forEach((ch, i) => {
      ch.classList.remove('sel','ok','no');
      if (correct.has(i)) ch.classList.add('ok');
      else if (multiPick.has(i)) ch.classList.add('no');
    });
    fb.className = 'feedback show';
    if (ok){
      fb.classList.add('good'); fb.textContent = '\u2713 Correct.';
      solvedCount++; $('score').textContent = 'Solved ' + solvedCount;
    } else {
      fb.classList.add('bad');
      fb.textContent = 'Not quite \u2014 the correct set is highlighted green. See the steps below.';
    }
    return;
  }

  if (problem.match){
    const rows = [...$('answers').querySelectorAll('.matchrow')];
    let all = true, blank = false;
    rows.forEach(r => {
      const i = +r.dataset.idx;
      const sel = r.querySelector('select');
      const tag = r.querySelector('.tag');
      r.classList.remove('ok','no');
      if (sel.value === ''){ blank = true; all = false; if(tag) tag.textContent=''; return; }
      if (+sel.value === problem.match.rows[i].correct){ r.classList.add('ok'); if(tag) tag.textContent='correct'; }
      else { r.classList.add('no'); if(tag) tag.textContent='try again'; all = false; }
    });
    fb.className = 'feedback show';
    if (blank){ fb.classList.add('bad'); fb.textContent = 'Match every row before checking.'; }
    else if (all){
      fb.classList.add('good'); fb.textContent = '\u2713 All matched correctly.';
      solvedCount++; $('score').textContent = 'Solved ' + solvedCount;
    } else {
      fb.classList.add('bad');
      fb.textContent = 'Not quite \u2014 the green rows are right; fix the others or peek at the steps.';
    }
    return;
  }

  const inputs = [...$('answers').querySelectorAll('input')];
  let allCorrect = true, anyBlank = false;

  inputs.forEach(inp => {
    const idx = +inp.dataset.idx;
    const part = problem.parts[idx];
    const field = inp.closest('.field');
    const tag = field.querySelector('.tag');
    field.classList.remove('ok', 'no');

    if (part.type === 'text'){
      const raw = inp.value.trim();
      if (raw === ''){ anyBlank = true; allCorrect = false; if(tag) tag.textContent=''; return; }
      const got = normTxt(raw);
      const ok = part.accept.map(normTxt).includes(got);
      if (ok){ field.classList.add('ok'); if(tag) tag.textContent='correct'; }
      else { field.classList.add('no'); if(tag) tag.textContent='try again'; allCorrect = false; }
    } else {
      const val = parseNum(inp.value);
      if (val === null){ anyBlank = true; allCorrect = false; if(tag) tag.textContent=''; return; }
      if (Math.abs(val - part.answer) <= (part.tol ?? 0.01)){ field.classList.add('ok'); if(tag) tag.textContent='correct'; }
      else { field.classList.add('no'); if(tag) tag.textContent='try again'; allCorrect = false; }
    }
  });

  fb.className = 'feedback show';
  if (anyBlank){
    fb.classList.add('bad');
    fb.textContent = 'Enter an answer in each blank.';
  } else if (allCorrect){
    fb.classList.add('good');
    fb.textContent = inputs.length > 1 ? '\u2713 All correct — nice work.' : '\u2713 Correct.';
    solvedCount++; $('score').textContent = 'Solved ' + solvedCount;
  } else {
    fb.classList.add('bad');
    fb.textContent = 'Not quite — fix the highlighted blank and try again, or peek at the steps.';
  }
}

function showSteps(){ $('solution').classList.add('show'); typeset(); }

$('check').addEventListener('click', checkAnswers);

/* =========================================================================

   Interior (tangency) solutions and corner solutions.

/* fraction display helper: px/py as a tidy string */
function frac(p, q){
  const g = (function gcd(a,b){ return b ? gcd(b, a%b) : a; })(p, q);
  const a = p/g, b = q/g;
  return b === 1 ? String(a) : `${a}/${b}`;
}

const QUESTIONS = [

  /* ----- 1. Cobb-Douglas interior optimum, guided (u = xy) ------------
     Walk the tangency method: relative price, marginal utilities, MRS,
     optimality y/x = px/py, then the budget line. Back-solved so that
     x* = M/(2 px) and y* = M/(2 py) are integers. */
  {
    key: 'cobbxy',
    name: 'Optimum: u = xy',
    eyebrow: 'Tangency: \\(MRS=p_x/p_y\\)',
    gen(){
      // EDIT NUMBERS HERE — prices and a scale k give clean integer answers.
      const px = pick([1,2,3,4]), py = pick([1,2,3,4]);
      const k  = randint(2,6);
      const M  = 2 * px * py * k;          // income
      const xs = M / (2 * px);             // = py*k
      const ys = M / (2 * py);             // = px*k
      const r  = round(px / py, 4);

      const promptHTML = `
        <p>Income \\(M=${M}\\) is spent on goods \\(x\\) and \\(y\\) with utility
           \\( U(x,y)=xy \\). Prices are \\( p_x=${px},\\ p_y=${py} \\).</p>
        <p>Work through the tangency method:</p>`;
      const solutionHTML = `
        <h4>Worked solution</h4>
        <p>Relative price \\( p_x/p_y=${frac(px,py)} \\). Marginal utilities
           \\( MU_x=y,\\ MU_y=x \\), so \\( MRS=\\dfrac{MU_x}{MU_y}=\\dfrac{y}{x} \\).</p>
        <p>Optimality \\( MRS=\\dfrac{p_x}{p_y} \\Rightarrow \\dfrac{y}{x}=${frac(px,py)}
           \\Rightarrow y=${frac(px,py)}\\,x \\).</p>
        <p>Budget \\( ${M}=p_x x+p_y y=${px}x+${py}\\left(${frac(px,py)}x\\right)
           \\Rightarrow x^*=\\mathbf{${xs}},\\quad y^*=\\mathbf{${ys}} \\).</p>`;
      return {
        promptHTML,
        parts: [
          { label: '\\(p_x/p_y=\\)', answer: r, tol: 0.02, accept: [frac(px,py)] },
          { type: 'text', label: '\\(MU_x=\\)', accept: ['y'] },
          { type: 'text', label: '\\(MU_y=\\)', accept: ['x'] },
          { label: '\\(x^*=\\)', answer: xs, tol: 0.01 },
          { label: '\\(y^*=\\)', answer: ys, tol: 0.01 }
        ],
        solutionHTML
      };
    }
  },

  /* ----- 2. Comparative statics / quick optimum (u = xy), numeric ------
     Same model; a single price is given and you solve for x* only.
     Mirrors "raise p_x, find the new x*". */
  {
    key: 'cobbx',
    name: 'New price → new x*',
    eyebrow: 'Comparative statics',
    gen(){
      // EDIT NUMBERS HERE
      const px = pick([2,3,4,5]), py = pick([1,2,3]);
      const xs = randint(4,20);
      const M  = 2 * px * xs;              // guarantees x* = M/(2px) integer
      const ys = M / (2 * py);
      const promptHTML = `
        <p>With \\( U(x,y)=xy \\) and income \\(M=${M}\\), the prices are now
           \\( p_x=${px},\\ p_y=${py} \\).</p>
        <p>In the optimal bundle, what is the consumption of good \\(x\\)?</p>`;
      const solutionHTML = `
        <h4>Worked solution</h4>
        <p>Tangency gives \\( y/x=p_x/p_y \\), and for \\(U=xy\\) the demand is
           \\( x^*=\\dfrac{M}{2p_x} \\).</p>
        <p>\\( x^*=\\dfrac{${M}}{2\\cdot${px}}=\\mathbf{${xs}} \\)
           (and \\( y^*=\\dfrac{M}{2p_y}=${ys} \\)).</p>`;
      return { promptHTML, parts: [{ label: '\\(x^*=\\)', answer: xs, tol: 0.01 }], solutionHTML };
    }
  },

  /* ----- 3. Square-root (Cobb-Douglas ½,½) interior optimum, guided ---
     u = sqrt(x y). Same tangency logic; MU's are shown, you fill the
     numeric results. x* = M/(2 px), y* = M/(2 py). */
  {
    key: 'sqrtutil',
    name: 'Optimum: u = √(xy)',
    eyebrow: 'Tangency: \\(MRS=p_x/p_y\\)',
    gen(){
      // EDIT NUMBERS HERE
      const px = pick([1,2,3,4,5]), py = pick([1,2,3,4,5]);
      const k  = randint(2,6);
      const M  = 2 * px * py * k;
      const xs = M / (2 * px), ys = M / (2 * py);
      const r  = round(px / py, 4);
      const promptHTML = `
        <p>A consumer has utility \\( U(x,y)=\\sqrt{xy} \\), income \\(M=${M}\\),
           and prices \\( p_x=${px},\\ p_y=${py} \\).</p>
        <p>The marginal utilities are \\( MU_x=\\tfrac12\\sqrt{y/x} \\) and
           \\( MU_y=\\tfrac12\\sqrt{x/y} \\), so \\( MRS=\\dfrac{MU_x}{MU_y}=\\dfrac{y}{x} \\).
           Solve for the optimum:</p>`;
      const solutionHTML = `
        <h4>Worked solution</h4>
        <p>\\( MRS=\\dfrac{y}{x}=\\dfrac{p_x}{p_y}=${frac(px,py)} \\Rightarrow y=${frac(px,py)}\\,x \\).</p>
        <p>Budget \\( ${M}=${px}x+${py}y \\Rightarrow
           x^*=\\mathbf{${xs}},\\ y^*=\\mathbf{${ys}} \\).
           (Same demands as \\(u=xy\\): a monotonic transformation, same preferences.)</p>`;
      return {
        promptHTML,
        parts: [
          { label: '\\(p_x/p_y=\\)', answer: r, tol: 0.02, accept: [frac(px,py)] },
          { label: '\\(x^*=\\)', answer: xs, tol: 0.01 },
          { label: '\\(y^*=\\)', answer: ys, tol: 0.01 }
        ],
        solutionHTML
      };
    }
  },

  /* ----- 4. Perfect complements u = min(x, y), numeric ----------------
     Optimum consumes equal amounts: x = y = M/(px+py). */
  {
    key: 'complements',
    name: 'Perfect complements',
    eyebrow: '\\(u=\\min\\{x,y\\}\\)',
    gen(){
      // EDIT NUMBERS HERE
      const px = pick([2,3,4,5,10]), py = pick([2,3,4,5,10]);
      const k  = randint(3,12);
      const M  = (px + py) * k;            // x* = y* = k
      const promptHTML = `
        <p>Left shoes \\(x\\) and right shoes \\(y\\) cost \\( p_x=\\$${px} \\) and
           \\( p_y=\\$${py} \\). Budget is \\(\\$${M}\\) and utility is
           \\( U(x,y)=\\min\\{x,y\\} \\).</p>
        <p>How many units of \\(x\\) are bought at the optimum?</p>`;
      const solutionHTML = `
        <h4>Worked solution</h4>
        <p>Perfect complements are consumed in fixed proportion \\(x=y\\). Substituting into the
           budget: \\( p_x x+p_y x=M \\Rightarrow x=\\dfrac{M}{p_x+p_y} \\).</p>
        <p>\\( x^*=\\dfrac{${M}}{${px}+${py}}=\\mathbf{${k}} \\) (and \\(y^*=${k}\\)).</p>`;
      return { promptHTML, parts: [{ label: '\\(x^*=\\)', answer: k, tol: 0.01 }], solutionHTML };
    }
  },

  /* ----- 5. Perfect substitutes u = a x + b y, corner, numeric --------
     Compare marginal utility per dollar: a/px vs b/py. Spend everything on
     the winner. Answer is how many x (either M/px or 0). No ties. */
  {
    key: 'substitutes',
    name: 'Perfect substitutes',
    eyebrow: '\\(u=ax+by\\)',
    gen(){
      // EDIT NUMBERS HERE — resample until there's a strict winner.
      let a, b, px, py;
      do {
        a = randint(2,6); b = randint(2,6);
        px = pick([2,3,4,5]); py = pick([2,3,4,5]);
      } while (a * py === b * px);         // avoid a/px == b/py
      const xWins = a * py > b * px;       // a/px > b/py  ⇔  a·py > b·px
      const units = pick([5,6,8,10,12]);
      const M = xWins ? px * units : py * units;   // clean whichever we spend on
      const xs = xWins ? M / px : 0;
      const promptHTML = `
        <p>Coke \\(x\\) and Pepsi \\(y\\) cost \\( p_x=\\$${px} \\) and \\( p_y=\\$${py} \\).
           Budget is \\(\\$${M}\\) and utility is \\( U(x,y)=${a}x+${b}y \\).</p>
        <p>How many cans of \\(x\\) are bought at the optimum?</p>`;
      const solutionHTML = `
        <h4>Worked solution</h4>
        <p>With perfect substitutes, compare marginal utility per dollar:
           \\( \\dfrac{MU_x}{p_x}=\\dfrac{${a}}{${px}}=${round(a/px,3)} \\) vs
           \\( \\dfrac{MU_y}{p_y}=\\dfrac{${b}}{${py}}=${round(b/py,3)} \\).</p>
        <p>${xWins
              ? `Good \\(x\\) gives more utility per dollar, so spend it all on \\(x\\):
                 \\( x^*=\\dfrac{${M}}{${px}}=\\mathbf{${xs}} \\).`
              : `Good \\(y\\) gives more utility per dollar, so buy only \\(y\\):
                 \\( x^*=\\mathbf{0} \\).`}</p>`;
      return { promptHTML, parts: [{ label: '\\(x^*=\\)', answer: xs, tol: 0.01 }], solutionHTML };
    }
  },

  /* ----- 6. Cobb-Douglas with unequal exponents (income shares) — NEW -
     u = x^a y^b spends share a/(a+b) of income on x:
       x* = a/(a+b) · M/px ,  y* = b/(a+b) · M/py. */
  {
    key: 'cobbshare',
    name: 'Income shares',
    eyebrow: '\\(u=x^{a}y^{b}\\)',
    gen(){
      // EDIT NUMBERS HERE
      const a = pick([1,2,3]), b = pick([1,2,3]);
      const s = a + b;
      const px = pick([1,2,3,4]), py = pick([1,2,3,4]);
      const k  = randint(2,6);
      const M  = s * px * k;               // x* = a·k
      const xs = a * M / (s * px);         // = a*k
      const ys = b * M / (s * py);
      const yInt = Number.isInteger(ys);
      const promptHTML = `
        <p>Utility is \\( U(x,y)=x^{${a}}y^{${b}} \\), income is \\(M=${M}\\), and prices are
           \\( p_x=${px},\\ p_y=${py} \\).</p>
        <p>How much \\(x\\) does the consumer buy at the optimum?</p>`;
      const solutionHTML = `
        <h4>Worked solution</h4>
        <p>For \\( U=x^{a}y^{b} \\), tangency gives the constant-share rule: the consumer spends a
           fraction \\( \\dfrac{a}{a+b} \\) of income on \\(x\\). So
           \\( x^*=\\dfrac{a}{a+b}\\cdot\\dfrac{M}{p_x} \\).</p>
        <p>\\( x^*=\\dfrac{${a}}{${s}}\\cdot\\dfrac{${M}}{${px}}=\\mathbf{${xs}} \\)${
           yInt ? ` (and \\( y^*=\\dfrac{${b}}{${s}}\\cdot\\dfrac{${M}}{${py}}=${ys} \\)).` : `.`}</p>`;
      return { promptHTML, parts: [{ label: '\\(x^*=\\)', answer: xs, tol: 0.01 }], solutionHTML };
    }
  },

  /* ----- 7. Perfect complements in fixed proportion u = min(x, βy) — NEW
     Optimum sets x = β y. Then y* = M/(px·β + py), x* = β y*. */
  {
    key: 'complexratio',
    name: 'Complements (fixed ratio)',
    eyebrow: '\\(u=\\min\\{x,\\beta y\\}\\)',
    gen(){
      // EDIT NUMBERS HERE — β units of x are needed per unit of y.
      const beta = pick([2,3]);
      const px = pick([1,2,3]), py = pick([2,3,4,6]);
      const k  = randint(2,6);
      const M  = (px * beta + py) * k;     // y* = k, x* = beta*k
      const ys = k, xs = beta * k;
      const promptHTML = `
        <p>A recipe needs \\(${beta}\\) units of \\(x\\) for each unit of \\(y\\): utility is
           \\( U(x,y)=\\min\\{x,\\,${beta}y\\} \\). Prices are \\( p_x=${px},\\ p_y=${py} \\)
           and income is \\(M=${M}\\).</p>
        <p>How many units of \\(x\\) are bought at the optimum?</p>`;
      const solutionHTML = `
        <h4>Worked solution</h4>
        <p>No good is wasted, so \\( x=${beta}y \\). Substitute into the budget:
           \\( p_x(${beta}y)+p_y y=M \\Rightarrow y^*=\\dfrac{M}{${beta}p_x+p_y} \\).</p>
        <p>\\( y^*=\\dfrac{${M}}{${beta}\\cdot${px}+${py}}=${ys} \\), so
           \\( x^*=${beta}\\cdot${ys}=\\mathbf{${xs}} \\).</p>`;
      return { promptHTML, parts: [{ label: '\\(x^*=\\)', answer: xs, tol: 0.01 }], solutionHTML };
    }
  }

];
